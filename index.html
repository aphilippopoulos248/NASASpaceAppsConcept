<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lunyx: pick a place and a date on the Moon, drop to the surface, and see where the Sun and Earth sit against the real skyline." />
    <title>Lunyx · Lunar landing site navigator</title>
  </head>
  <body data-view="globe">
    <canvas id="scene" aria-label="3D view of the Moon. Drag to turn, scroll to zoom, click a marker to open a site."></canvas>

    <!--
      Layout frame. Each region is a mount point handed to exactly one module by src/main.ts;
      modules build their own DOM inside it. data-views lists the views a region shows in.
    -->
    <div class="shell" id="shell">
      <header class="region region-wordmark" data-views="globe"><h1 class="wordmark">LUNYX</h1></header>
      <button class="ly-btn left-toggle" id="left-toggle" type="button" aria-expanded="false" aria-controls="region-left">Filters</button>
      <aside class="region region-left" id="region-left" data-views="globe" aria-label="Filters"></aside>
      <section class="region region-metrics" id="region-metrics" data-views="surface" aria-label="Key metrics"></section>
      <aside class="region region-card" id="region-card" data-views="globe" aria-label="Selected site"></aside>
      <div class="region region-close" id="region-close" data-views="surface"></div>
      <div class="region region-compass" id="region-compass" data-views="globe"></div>
      <section class="region region-chart" id="region-chart" data-views="surface" aria-label="Skyline chart"></section>
      <section class="region region-surface-hud" id="region-surface-hud" data-views="surface" aria-label="Surface view"></section>
      <section class="region region-scrubber" id="region-scrubber" aria-label="Time"></section>
      <section class="region region-locator" id="region-locator" aria-label="Locator map"></section>
      <div class="region region-assistant" id="region-assistant"></div>
      <aside class="region region-drawer" id="region-drawer" aria-label="Assistant"></aside>
      <section class="region region-compare" id="region-compare" aria-label="Comparison"></section>
      <div class="region region-toast" id="region-toast" role="status" aria-live="polite"></div>
    </div>

    <div class="loading" id="loading" role="status">Loading lunar surface…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
